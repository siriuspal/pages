<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>siriuspal pages</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#1b2333; --muted:#5d687d; --line:#dde2ec; --accent:#2f4bff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141d; --panel:#181d29; --ink:#e8ecf5; --muted:#9aa4ba; --line:#2a3142; --accent:#7d8dff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141d; --panel:#181d29; --ink:#e8ecf5; --muted:#9aa4ba; --line:#2a3142; --accent:#7d8dff; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
h1{font-size:clamp(30px,6vw,42px);letter-spacing:-.02em;line-height:1.1;margin:40px 0 8px}
.updated{color:var(--muted);margin:0 0 28px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.summary ul{margin:0;padding-left:20px}
li{margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
<h1>siriuspal pages</h1>
<p class="updated">Public pages for private home projects.</p>
<div class="summary">
<ul>
<li><a href="alexa-privacy.html">Home Blinds privacy policy</a></li>
</ul>
</div>
</div>
</body>
</html>
